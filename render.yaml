services:
  - type: web
    name: kaushalya-physio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: DB_NAME
        value: kaushalya_physio
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://k.2up.in,https://kaushalya-advanced-physio-dtb2.vercel.app,https://kaushalya-advanced-physio.vercel.app"
      - key: PUBLIC_APP_URL
        value: "https://k.2up.in"
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
